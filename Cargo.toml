[package]
name = "market-making"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
tokio-tungstenite = { version = "0.28.0" }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.21"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
rust_decimal = "1.37"
figment = {version = "0.10.19", features = ["toml"]}
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full","tracing"] }

futures-util = "0.3"
console-subscriber = "0.5.0" # Just for debugging
clap = {version="4.5.54", features=["cargo"]}
